# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md).
# Stack: .NET 10 · Blazor Server · SQL Server LocalDB (ADR-0001, ADR-0002).
#
# Walking skeleton (spec 0001) activated restore/format/build/test-unit/vulnerable-packages.
# test-integration and test-e2e stay commented until their specs add LocalDB and Playwright.
# Tests run on Microsoft.Testing.Platform (xunit.v3, .NET 10: VSTest is not supported; global.json
# opts in): selectors are --filter-[not-]trait, --minimum-expected-tests 1 fails a step that runs
# zero tests (a filter that silently runs zero tests is a false green). Do not pass
# --disable-build-servers to `dotnet test` here: it is forwarded to the test app and breaks the
# run; with --no-build no build server is started anyway.
#
# Resource hygiene inventory (docs/testing.md):
#   MSBuild worker nodes, VBCSCompiler (Roslyn server), Razor build server
#     -> --disable-build-servers on restore/build (not on `dotnet test`, see above)
#   test app processes (Microsoft.Testing.Platform, one exe per test project)
#     -> exit with dotnet test; verified by the residue test
#   LocalDB instance sqlservr.exe (stays up after the last connection)
#     -> stopped inside the same step, exit code kept
#   Playwright browsers + the app under test (Kestrel) -> owned and stopped by the E2E fixture
#
restore [fast]: dotnet restore PolsanLeaveManager.slnx --disable-build-servers
format [fast]: dotnet format PolsanLeaveManager.slnx --verify-no-changes --no-restore
build [fast]: dotnet build PolsanLeaveManager.slnx -c Release --no-restore --disable-build-servers -warnaserror
# Fast/full split by selector, not by list: untagged tests are fast; Integration/E2E are full-only.
test-unit [fast]: dotnet test --solution PolsanLeaveManager.slnx -c Release --no-build --filter-not-trait "Category=Integration" --filter-not-trait "Category=E2E" --minimum-expected-tests 1
# resource hygiene: LocalDB instance stopped in the same step
# test-integration: dotnet test --solution PolsanLeaveManager.slnx -c Release --no-build --filter-trait "Category=Integration" --minimum-expected-tests 1; rc=$?; sqllocaldb stop PolsanLeaveTests -k >/dev/null 2>&1; exit $rc
# resource hygiene: single worker, headless (fixture default); LocalDB stopped in the same step
# test-e2e: dotnet test --solution PolsanLeaveManager.slnx -c Release --no-build --filter-trait "Category=E2E" --minimum-expected-tests 1 --maximum-parallel-tests 1; rc=$?; sqllocaldb stop PolsanLeaveTests -k >/dev/null 2>&1; exit $rc
vulnerable-packages: out=$(dotnet list PolsanLeaveManager.slnx package --vulnerable --include-transitive) || exit 1; echo "$out"; ! printf '%s' "$out" | grep -q 'has the following vulnerable packages'
